<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zoo Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Witaj w Zoo!</h1>

    <button onclick="getProfile()">👤 Moje dane</button>

    <h2>Aktualizuj moje dane</h2>
    <div class="form-grid">
      <div>
        <input type="text" id="updateUsername" placeholder="Nowa nazwa użytkownika">
        <input type="text" id="updateFirstName" placeholder="Imię">
        <input type="text" id="updateLastName" placeholder="Nazwisko">
      </div>
      <div>
        <input type="email" id="updateEmail" placeholder="Email">
        <input type="text" id="updateRole" placeholder="Rola">
        <input type="date" id="updateHireDate">
      </div>
    </div>

    <button onclick="updateUserFromInput()">🔄 Zaktualizuj moje dane</button>
    <button onclick="getHello()">🌿 Hello (ogólne)</button>

    <h2>Hello dla ról:</h2>
    <button onclick="getHelloRole('Veterinarian')">🐾 Weterynarz</button>
    <button onclick="getHelloRole('Registrar')">📝 Rejestrator</button>
    <button onclick="getHelloRole('Caregiver')">🦴 Opiekun</button>
    <button onclick="getHelloRole('Director')">🎩 Dyrektor</button>
    <button onclick="getHelloRole('Admin')">🔐 Admin</button>
    <button onclick="getHelloRole('VeterinarianCaregiver')">🐾+🦴 Weter. & Opiekun</button>

    <h2>Admin — użytkownicy</h2>
    <button onclick="getUsers()">📋 Pobierz użytkowników</button>

    <h3>Usuń użytkownika</h3>
    <input type="number" id="deleteUserId" placeholder="ID użytkownika">
    <button onclick="deleteUserFromInput()">🗑️ Usuń użytkownika</button>

    <h2>Aktualizuj użytkownika</h2>
    <div class="form-grid">
      <div>
        <input type="number" id="updateUserIdA" placeholder="ID użytkownika">
        <input type="text" id="updateUsernameA" placeholder="Username">
        <input type="text" id="updateFirstNameA" placeholder="First Name">
      </div>
      <div>
        <input type="text" id="updateLastNameA" placeholder="Last Name">
        <input type="email" id="updateEmailA" placeholder="Email">
        <input type="text" id="updateRoleA" placeholder="Role">
        <input type="date" id="updateHireDateA">
      </div>
    </div>
  
    <button onclick="updateUserFromInputAdmin()">🔄 Aktualizuj użytkownika</button>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
