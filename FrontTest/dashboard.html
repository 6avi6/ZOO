<!DOCTYPE html>
<html lang="pl">
<head>

  <title>Zoo Dashboard</title>

</head>
<body>

    <h2>Hello dla ról:</h2>

    <button onclick="getHelloRole('Admin')">🔐 Admin</button>
    <button onclick="getHelloRole('VeterinarianCaregiver')">🐾+🦴 Weter. & Opiekun</button>

    <h2>Admin — użytkownicy</h2>
    <button onclick="getUsers()">📋 Pobierz użytkowników</button>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
