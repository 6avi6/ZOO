<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Rejestracja</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>Rejestracja</h2>
    <form id="register-form">
      <input type="text" id="register-username" placeholder="Nazwa użytkownika" required />
      <input type="password" id="register-password" placeholder="Hasło" required />
      <select id="register-role" required>
        <option value="">-- Wybierz rolę --</option>
        <option value="DIRECTOR">Dyrektor</option>
        <option value="CAREGIVER">Opiekun</option>
        <option value="REGISTRAR">Rejestrator</option>
        <option value="VETERINARIAN">Weterynarz</option>
      </select>
      <button type="submit">Zarejestruj się</button>
    </form>
    <div id="register-message"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
