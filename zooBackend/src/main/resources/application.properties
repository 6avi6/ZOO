spring.application.name=zooBackend
server.port=8083

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:8084}/${PGDATABASE:zoo}
spring.datasource.username=${PGUSER:admin}
spring.datasource.password=${PGPASSWORD:admin}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

jwt.secret=${JWT_SECRET_KEY:3Fk9bH2nV6D7Ml7H9QzPjQogS2nB8tVWyH4E0YYvD2g=}
# 15 min in ms
jwt.access-expiration=900000
# 3 days in s
jwt.refresh-expiration=259200

